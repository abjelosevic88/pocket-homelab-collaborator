name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - name: Vet & test
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o pocket-review ./cmd/pocket-review
      - name: Smoke test
        run: |
          DATA_DIR=/tmp/pc DEMO_DATA=true AUTH_MODE=none ./pocket-review &
          sleep 2
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/v1/dashboard | grep -q week_text
          curl -fsS http://localhost:8080/api/v1/reviews/1/report | grep -q heatmap
          curl -fsS -o /tmp/r.pdf http://localhost:8080/api/v1/reviews/1/report.pdf && head -c 5 /tmp/r.pdf | grep -q '%PDF-'
          curl -fsS http://localhost:8080/api/v1/reviews/1/revisions/2/file | head -c 5 | grep -q '%PDF-'
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pocket-review:pr
